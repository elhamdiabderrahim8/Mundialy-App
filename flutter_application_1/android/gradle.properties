# Ne JAMAIS pinner org.gradle.java.home avec un chemin absolu local : le path
# n'existe pas sur les runners GitHub Actions ("Java home supplied is invalid").
# Gradle utilise JAVA_HOME (fourni par actions/setup-java : Zulu 17).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
# Supprime l'erreur de validation de startapp_sdk qui requiert compileSdk 37
android.suppressUnsupportedCompileSdk=37
